<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440" role="img" aria-label="PanelBreak channel banner">
  <title>PanelBreak channel banner 2560x1440</title>
  <defs>
    <pattern id="hal_b" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3" fill="#F7F2E9" fill-opacity="0.10"/>
    </pattern>
    <pattern id="speed" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(66)">
      <rect width="12" height="34" fill="#FF3B3B" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="2560" height="1440" fill="#131110"/>
  <rect width="2560" height="1440" fill="url(#hal_b)"/>
  <!-- speed-line wedge, left -->
  <rect x="-260" y="0" width="1000" height="1440" fill="url(#speed)"/>

  <!-- ===== TV/mobile safe zone: 1546x423 centered ===== -->
  <g transform="translate(507,508)">
    <!-- mark -->
    <g transform="translate(0,60) scale(3.0)">
      <rect x="0" y="0" width="100" height="100" rx="15" fill="#131110" stroke="#F0E9DC" stroke-width="7"/>
      <path d="M31 24 L62 41 L31 58 Z" fill="#FF3B3B"/>
      <circle cx="61" cy="15" r="3.4" fill="#FF3B3B"/>
      <circle cx="70" cy="21" r="2.4" fill="#FF3B3B"/>
    </g>
    <!-- wordmark + tagline -->
    <text x="350" y="180" font-family="Anton, Impact, sans-serif" font-size="150" fill="#F7F2E9">PANEL<tspan fill="#FF3B3B">BREAK</tspan></text>
    <text x="354" y="250" font-family="'Space Mono', monospace" font-size="34" letter-spacing="10" fill="#A79E90">EVERY ARC, EXPLAINED</text>
    <!-- handle, right -->
    <text x="1546" y="200" text-anchor="end" font-family="'Space Mono', monospace" font-size="38" letter-spacing="4" fill="#A79E90">@PanelBreak</text>
  </g>
</svg>
